<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chatbot</title>
    </head>
    <body>
        <div class="js-container"></div>
        <script src="https://unpkg.com/supersimpledev/react.js"></script>
        <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
        <script src="https://unpkg.com/supersimpledev/babel.js"></script>
        <script type="text/babel">
            function ChatInput() {
                return (
                    <>
                        <input placeholder="Send a message to Chatbot"
                        size="30" />
                        <button>Send</button>
                    </>
                );
            }

            function ChatMessage({message, sender}) {
                //const message = props.message;
                return (
                    <div>
                        {sender === "robot" && (
                            <img src="robot.png" width="50" />
                        )}
                        {message}
                        {sender === "user" && (
                            <img src="user.png" width="50" />
                        )}
                    </div>
                );
            }

            function App() {
                const chatMessages = [
                    { message: "hello chatbot", sender: "user" },
                    { message: "Hello! How can I help you?", sender: "robot" },
                    { message: "Can you get me todays date?", sender: "user" },
                    { message: "Sure! Today is October 29th, 2026", sender: "robot" }
                ];

                const chatMessageComponents = chatMessages.map((chatMessage) => (
                    <ChatMessage message={chatMessage.message} sender={chatMessage.sender} />
                ));
                return (
                    <>
                        <ChatInput />
                        {chatMessageComponents}
                    </>
                );
            }
            const container = document.querySelector('.js-container');
            ReactDOM.createRoot(container).render(<App />);
        </script>
    </body>
</html>
